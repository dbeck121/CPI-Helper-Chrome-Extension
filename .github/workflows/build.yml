# Name: Create Zip file from Dev
# Trigger: Pushes to `dev`.
# Action:  Runs zipFiles.sh to (re)generate release artifacts in bin/ and
#          regenerated docs, then commits and pushes them back to `dev`.
#          On success, release.yml is triggered via workflow_run.
#
# Note: Commits pushed using the default GITHUB_TOKEN do not re-trigger
# this workflow, so no explicit loop guard is needed.

name: Create Zip file from Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  generate_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run zipFiles.sh
        run: |
          chmod +x ./zipFiles.sh
          ./zipFiles.sh

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Commit and push generated files
        run: |
          git add bin/ docs/
          if git diff --staged --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: regenerate release artifacts from zipFiles.sh"
          git push
