# Name: Release on main
# Trigger: Pushes to `main` (typically a merged PR from dev).
# Action:  Reads version from manifest.json, downloads the zip artifact
#          built by the most recent successful "Build extension on dev"
#          run, then creates/updates the matching GitHub Release with
#          that zip as an asset.

name: Release on main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version from manifest.json
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CLEAN_VERSION="$VERSION"
          else
            CLEAN_VERSION=$(echo "$VERSION" | awk -F. '{print $1"."$2"."$3}')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> "$GITHUB_ENV"

      - name: Find latest successful dev build
        id: dev_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --workflow="Build extension on dev" \
            --branch=dev \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful dev build found — cannot release."
            exit 1
          fi
          echo "Using dev run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download zip artifact from dev build
        uses: actions/download-artifact@v8
        with:
          name: cpi-helper-extension
          path: dist
          run-id: ${{ steps.dev_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ env.CLEAN_VERSION }}"
          name: "${{ env.CLEAN_VERSION }}"
          body: "Release created with version ${{ env.VERSION }}"
          files: dist/*.zip
