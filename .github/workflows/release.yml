# Name: Release on main
# Trigger: Pushes to `main` (typically a merged PR from dev).
# Action:  Reads version from manifest.json, builds the zip with zipFiles.sh
#          from the pushed commit, then creates/updates the matching
#          GitHub Release with that zip as an asset. For a new version the same zip is then
#          published to the Chrome Web Store, Edge Add-ons and Firefox
#          Add-ons (see the publish-* jobs, secrets are listed there).

name: Release on main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      is_new: ${{ steps.new_version.outputs.is_new }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version from manifest.json
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CLEAN_VERSION="$VERSION"
          else
            CLEAN_VERSION=$(echo "$VERSION" | awk -F. '{print $1"."$2"."$3}')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> "$GITHUB_ENV"

      # the stores reject a version they already have, so publish only when the release did not exist yet
      - name: Is this a new version
        id: new_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$CLEAN_VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      # built from the commit that was pushed to main, not from an earlier dev build
      - name: Build zip
        run: |
          chmod +x ./zipFiles.sh
          ./zipFiles.sh
          ls -l dist

      - name: Build release notes from whatsNewLog.js
        run: |
          {
            echo "## What's new in v${VERSION}"
            echo
            awk '/const whats_new_log = `/{flag=1; next} /^`;/{flag=0} flag' whatsNew/whatsNewLog.js
          } > release_body.md
          echo "--- Release notes preview ---"
          cat release_body.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ env.CLEAN_VERSION }}"
          name: "${{ env.CLEAN_VERSION }}"
          body_path: release_body.md
          files: dist/*.zip

      - name: Keep zip for the store jobs
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # The three store jobs run independently, one failing store does not stop the others.
  # They wait for approval if the environment "store-publish" has required reviewers (recommended).
  # Secrets (Settings > Secrets and variables > Actions, or on the environment):
  #   CHROME_PUBLISHER_ID, CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
  #   EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY
  #   FIREFOX_JWT_ISSUER, FIREFOX_JWT_SECRET
  publish-chrome:
    needs: release
    if: needs.release.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    environment: store-publish
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-zip
          path: dist
      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: ${{ github.workspace }}/dist/CPI_Helper_Extension_v*.zip
          extension-id: epoggeaemnkacpinjfgccbjakglngkpb
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

  publish-edge:
    needs: release
    if: needs.release.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    environment: store-publish
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-zip
          path: dist
      - name: Publish to Edge Add-ons
        uses: wdzeng/edge-addon@v2.1.1
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: dist/CPI_Helper_Extension_v*.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}

  publish-firefox:
    needs: release
    if: needs.release.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    environment: store-publish
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-zip
          path: dist
      - name: Publish to Firefox Add-ons
        uses: wdzeng/firefox-addon@v1.2.1
        with:
          addon-guid: cpi_helper@dbeck121
          xpi-path: dist/CPI_Helper_Extension_v*.zip
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
