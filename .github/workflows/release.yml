# Name: Create Release from Manifest
# Trigger: Successful completion of "Create Zip file from Dev" on `dev`.
# Action:  Reads version from manifest.json, creates a GitHub Release for
#          that version and uploads all zips found in bin/ as assets.

name: Create Release from Manifest

on:
  workflow_run:
    workflows: ["Create Zip file from Dev"]
    types:
      - completed
    branches:
      - dev

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from manifest.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CLEAN_VERSION="$VERSION"
          else
            CLEAN_VERSION=$(echo "$VERSION" | awk -F. '{print $1"."$2"."$3}')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> "$GITHUB_ENV"

      - name: Find zip files in bin
        id: find_zips
        run: |
          ZIP_FILES=$(find ./bin -type f -name "*.zip" | tr '\n' '|')
          echo "Found zip files: $ZIP_FILES"
          echo "ZIP_FILES=$ZIP_FILES" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ env.CLEAN_VERSION }}"
          name: "${{ env.CLEAN_VERSION }}"
          body: "Release created with version ${{ env.VERSION }}"

      - name: Attach zip files to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS='|' read -r -a ZIP_ARRAY <<< "${{ env.ZIP_FILES }}"
          for ZIP_FILE in "${ZIP_ARRAY[@]}"; do
            if [ -z "$ZIP_FILE" ]; then continue; fi
            ZIP_BASENAME=$(basename "$ZIP_FILE")
            echo "Attaching $ZIP_BASENAME"
            gh release upload "${{ env.CLEAN_VERSION }}" "$ZIP_FILE" --clobber
          done
