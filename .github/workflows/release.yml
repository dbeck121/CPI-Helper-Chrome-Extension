# Name: Build and Release from Dev
# Trigger: Pushes to `dev`.
# Action:  Runs zipFiles.sh to produce release artifacts in dist/, then
#          creates (or updates) the GitHub Release matching manifest.json's
#          version and uploads the zips as release assets.
#
# Note: dist/ is gitignored, so artifacts live only inside the runner.
# Builds and the release step run in the same job so no cross-workflow
# artifact handover is needed.

name: Build and Release from Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build zip artifacts
        run: |
          chmod +x ./zipFiles.sh
          ./zipFiles.sh

      - name: Extract version from manifest.json
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CLEAN_VERSION="$VERSION"
          else
            CLEAN_VERSION=$(echo "$VERSION" | awk -F. '{print $1"."$2"."$3}')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ env.CLEAN_VERSION }}"
          name: "${{ env.CLEAN_VERSION }}"
          body: "Release created with version ${{ env.VERSION }}"
          files: dist/*.zip
